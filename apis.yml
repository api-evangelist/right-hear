name: Right Hear
description: >-
  Right Hear (RightHear) is an accessibility technology company, backed by Techstars, that helps
  people who are blind, have low vision, or face orientation and wayfinding challenges navigate
  indoor and complex public spaces more independently. Its solution pairs location sensors installed
  at points of interest with a companion smartphone app that delivers spoken, audible orientation
  cues and accessibility information to visitors, and is marketed primarily to businesses, venues,
  and public institutions seeking to make their physical environments more inclusive. At the time
  of this enrichment pass the company exposes no public developer API, SDK, or machine-readable API
  documentation surface, and its website sits behind a bot-protection challenge; this profile tracks
  the company's identity and public web presence for API and agentic-access discoverability.
